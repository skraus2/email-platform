# Production stack for one VM (with Amazon RDS PostgreSQL; no database here).
#
#   deploy/bin/render-env                       # secrets from SSM → /run/email-platform/app.env
#   deploy/bin/preflight                        # required files present
#   docker compose -f deploy/compose.yaml build
#   docker compose -f deploy/compose.yaml up -d --wait
#   docker compose -f deploy/compose.yaml run --rm admin <command>
#
# All services share the network namespace of "netns": the api's operator
# listener (with /metrics), the worker's metrics, Prometheus and Alertmanager
# listen on 127.0.0.1 only. Published are Caddy's 80/443 and the dashboard on
# the host's loopback (reached through an SSM port forward). Secrets come only from APP_ENV_FILE (tmpfs, written by
# render-env); nothing secret is in this file.

name: email-platform

x-hardened: &hardened
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  network_mode: service:netns
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-app: &app
  <<: *hardened
  image: ${APP_IMAGE:-email-platform-app:local}
  build: { context: .., dockerfile: Dockerfile }
  env_file: ["${APP_ENV_FILE:-/run/email-platform/app.env}"]
  volumes:
    - ${DB_CA_FILE:-/etc/email-platform/rds-ca.pem}:/etc/email-platform/db-ca.pem:ro

services:
  # Owns the shared network namespace and the published ports; never changes,
  # so restarting any other service keeps the namespace.
  netns:
    image: registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    # Lets the non-root Caddy bind 80 and 443 in this namespace (no
    # capabilities needed).
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:3000"

  # Hands Caddy's certificate volumes to its non-root user (once; a no-op
  # afterwards).
  caddy-init:
    image: caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9
    entrypoint: ["chown", "-R", "1000:1000", "/data", "/config"]
    user: "0:0"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    network_mode: none
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  caddy:
    <<: *hardened
    image: caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9
    user: "1000:1000"
    # The image's caddy binary carries the file capability
    # cap_net_bind_service, which the kernel refuses to execute under
    # no-new-privileges; the bounding set holds only that capability.
    security_opt: []
    cap_add: [NET_BIND_SERVICE]
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN to the API host name}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for Let's Encrypt}
    volumes:
      - ${CADDYFILE:-./caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: [/tmp]
    depends_on:
      caddy-init: { condition: service_completed_successfully }
      api: { condition: service_healthy }

  migrate:
    <<: *app
    command: ["/app/migrate", "up"]
    restart: "no"

  api:
    <<: *app
    command: ["/app/api"]
    environment:
      APP_ENV: production
      HTTP_ADDR: 127.0.0.1:8080
      ADMIN_HTTP_ADDR: 127.0.0.1:8081
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["/app/worker"]
    environment:
      APP_ENV: production
      METRICS_ADDR: 127.0.0.1:9091
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://127.0.0.1:9091/metrics"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      migrate: { condition: service_completed_successfully }

  # One-shot operator commands: docker compose run --rm admin <command>.
  admin:
    <<: *app
    entrypoint: ["/app/admin"]
    restart: "no"
    profiles: [ops]
    environment:
      APP_ENV: production

  dashboard:
    <<: *hardened
    image: ${DASHBOARD_IMAGE:-email-platform-dashboard:local}
    build: { context: .., dockerfile: apps/dashboard/Dockerfile }
    environment:
      # All interfaces of the shared namespace: a published port reaches the
      # namespace's own interface, not its loopback. netns publishes 3000 on
      # the host's loopback only (for the SSM port forward).
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      ADMIN_API_URL: http://127.0.0.1:8081
    tmpfs: [/tmp]
    depends_on:
      api: { condition: service_healthy }

  prometheus:
    <<: *hardened
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  alertmanager:
    <<: *hardened
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:9093
      - --cluster.listen-address=
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${ALERT_SECRETS_DIR:-/etc/email-platform/alertmanager}:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager

volumes:
  caddy-data:
  caddy-config:
  prometheus-data:
  alertmanager-data:
