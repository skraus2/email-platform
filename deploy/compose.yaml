# Production stack for one VM (with Amazon RDS PostgreSQL; no database here).
#
#   deploy/bin/render-env                       # secrets from SSM → /run/email-platform/app.env
#   deploy/bin/preflight                        # required files present
#   docker compose -f deploy/compose.yaml build
#   docker compose -f deploy/compose.yaml run --rm -T migrate   # before up: a failing
#                                               # migration leaves the old release running
#   docker compose -f deploy/compose.yaml up -d --wait
#   docker compose -f deploy/compose.yaml run --rm -T admin <command>
#
# All services share the network namespace of "netns": the api's operator
# listener (with /metrics), the worker's metrics, Prometheus and Alertmanager
# listen on 127.0.0.1 only. Published are Caddy's 80/443 and the dashboard on
# the host's loopback (reached through an SSM port forward). Only the
# application image's user may reach the instance metadata service (netns).
# Secrets come only from APP_ENV_FILE (tmpfs, written by render-env); nothing
# secret is in this file.

name: email-platform

x-hardened: &hardened
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  network_mode: service:netns
  restart: unless-stopped
  mem_limit: 256m
  pids_limit: 128
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-app: &app
  <<: *hardened
  image: ${APP_IMAGE:-email-platform-app:local}
  build: { context: .., dockerfile: Dockerfile }
  env_file: ["${APP_ENV_FILE:-/run/email-platform/app.env}"]
  volumes:
    - ${DB_CA_FILE:-/etc/email-platform/rds-ca.pem}:/etc/email-platform/db-ca.pem:ro

# Settings of every application process that are fixed by this deployment,
# not by the secret store. With SES against AWS the processes require that
# configured endpoint overrides are ignored.
x-app-env: &app-env
  APP_ENV: production
  AWS_IGNORE_CONFIGURED_ENDPOINT_URLS: "true"

x-netns-ready: &netns-ready
  netns: { condition: service_healthy }

services:
  # Owns the shared network namespace and the published ports; never changes,
  # so restarting any other service keeps the namespace. Restricts the
  # instance metadata service to APP_UID (the application image's nonroot
  # user) before reporting healthy; needs NET_ADMIN for that only.
  netns:
    image: email-platform-netns:local
    build: { context: ./netns }
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    environment:
      APP_UID: "65532"
    tmpfs: [/tmp, /run]
    restart: unless-stopped
    mem_limit: 32m
    pids_limit: 16
    # Lets the non-root Caddy bind 80 and 443 in this namespace without any
    # capability.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/guard-ready"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:3000"

  # Hands Caddy's certificate volumes to its non-root user on the first start;
  # later starts only check the owner (root without DAC capabilities cannot
  # traverse Caddy's 0700 directories).
  caddy-init:
    image: email-platform-caddy:local
    build: { context: ./caddy }
    entrypoint:
      - sh
      - -c
      - '[ "$$(stat -c %u /data)" = 1000 ] && [ "$$(stat -c %u /config)" = 1000 ] || chown -R 1000:1000 /data /config'
    user: "0:0"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    network_mode: none
    mem_limit: 32m
    pids_limit: 16
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  caddy:
    <<: *hardened
    image: email-platform-caddy:local
    build: { context: ./caddy }
    user: "1000:1000"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN to the API host name}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for Let's Encrypt}
    volumes:
      - ${CADDYFILE:-./caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./caddy/site.caddy:/etc/caddy/site.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "443"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      <<: *netns-ready
      caddy-init: { condition: service_completed_successfully }
      api: { condition: service_healthy }

  migrate:
    <<: *app
    command: ["/app/migrate", "up"]
    restart: "no"
    environment:
      <<: *app-env
    depends_on:
      <<: *netns-ready

  api:
    <<: *app
    command: ["/app/api"]
    mem_limit: 512m
    pids_limit: 256
    environment:
      <<: *app-env
      HTTP_ADDR: 127.0.0.1:8080
      ADMIN_HTTP_ADDR: 127.0.0.1:8081
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      <<: *netns-ready
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["/app/worker"]
    mem_limit: 512m
    pids_limit: 256
    environment:
      <<: *app-env
      METRICS_ADDR: 127.0.0.1:9091
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://127.0.0.1:9091/metrics"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      <<: *netns-ready
      migrate: { condition: service_completed_successfully }

  # One-shot operator commands: docker compose run --rm -T admin <command>.
  admin:
    <<: *app
    entrypoint: ["/app/admin"]
    restart: "no"
    profiles: [ops]
    environment:
      <<: *app-env
    depends_on:
      <<: *netns-ready

  dashboard:
    <<: *hardened
    image: ${DASHBOARD_IMAGE:-email-platform-dashboard:local}
    build: { context: .., dockerfile: apps/dashboard/Dockerfile }
    mem_limit: 512m
    environment:
      # All interfaces of the shared namespace: a published port reaches the
      # namespace's own interface, not its loopback. netns publishes 3000 on
      # the host's loopback only (for the SSM port forward).
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      ADMIN_API_URL: http://127.0.0.1:8081
    tmpfs: [/tmp]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      <<: *netns-ready
      api: { condition: service_healthy }

  prometheus:
    <<: *hardened
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    mem_limit: 1g
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      <<: *netns-ready

  alertmanager:
    <<: *hardened
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:9093
      - --cluster.listen-address=
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${ALERT_SECRETS_DIR:-/etc/email-platform/alertmanager}:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      <<: *netns-ready

volumes:
  caddy-data:
  caddy-config:
  prometheus-data:
  alertmanager-data:
