# Alert routing. The receiver's URL (a chat or paging webhook, which is a
# secret) is read from a file on the VM, never from this repository; it must
# not depend on this platform's own mail path (an outage would silence it).
route:
  receiver: team
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: team
      repeat_interval: 1h

receivers:
  - name: team
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/webhook-url
        send_resolved: true
