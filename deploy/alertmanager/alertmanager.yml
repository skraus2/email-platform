# Alert routing. The receiver is a placeholder: the operator replaces its URL
# with the team's chat or paging webhook before the first deployment. It must
# not depend on this platform's own mail path (an outage would silence it).
route:
  receiver: team
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: team
      repeat_interval: 1h

receivers:
  - name: team
    webhook_configs:
      - url: http://127.0.0.1:9095/alerts
        send_resolved: true
