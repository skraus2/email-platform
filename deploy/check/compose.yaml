# Local stand-ins for `make deploy-check` (never used on the VM): a TLS
# PostgreSQL with a locally generated CA in place of RDS, Mailpit as the
# provider, Caddy with its internal CA instead of Let's Encrypt. The checks
# reach the loopback-only services (Prometheus, Alertmanager, Mailpit) from
# inside the shared namespace.

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    network_mode: service:netns
    environment:
      POSTGRES_USER: email_platform
      POSTGRES_PASSWORD: ${CHECK_DB_PASSWORD:?}
      POSTGRES_DB: email_platform
    volumes:
      - ${CHECK_DIR:?}/certs:/certs-src:ro
    entrypoint:
      - sh
      - -c
      - >-
        install -d -o postgres -m 700 /run/pg-certs &&
        install -o postgres -m 600 /certs-src/server.key /run/pg-certs/server.key &&
        install -o postgres -m 644 /certs-src/server.crt /run/pg-certs/server.crt &&
        exec docker-entrypoint.sh postgres -c ssl=on
        -c ssl_cert_file=/run/pg-certs/server.crt -c ssl_key_file=/run/pg-certs/server.key
        -c listen_addresses=127.0.0.1 -c port=5433
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5433 -U email_platform -d email_platform",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    network_mode: service:netns
    environment:
      MP_SMTP_BIND_ADDR: 127.0.0.1:1025
      MP_UI_BIND_ADDR: 127.0.0.1:8025

  migrate:
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_started }
