version: "2"
sql:
  - engine: postgresql
    # App migrations only. River's schema (00003_river_queue.sql) is excluded
    # on purpose: its tables are owned by River and never queried directly.
    # Add every new app migration here (sqlc fails on unknown tables).
    schema:
      - db/migrations/00001_baseline.sql
      - db/migrations/00002_projects_and_api_keys.sql
      - db/migrations/00004_emails.sql
      - db/migrations/00005_idempotency_keys.sql
      - db/migrations/00006_email_error_codes.sql
      - db/migrations/00007_rate_limit_windows.sql
      - db/migrations/00008_suppressions.sql
      - db/migrations/00009_sender_identities.sql
      - db/migrations/00010_email_events.sql
      - db/migrations/00011_webhook_endpoints.sql
      - db/migrations/00012_event_receive_time.sql
      - db/migrations/00013_webhook_deliveries.sql
    queries: db/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_json_tags: false
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              type: int32
              pointer: true
