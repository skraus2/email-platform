# CI: the same gates as `make ci` (the vulnerability scan runs in
# vulncheck.yml). No secrets, no cloud access, no AWS.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: email_platform
          POSTGRES_PASSWORD: email_platform
          POSTGRES_DB: email_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U email_platform -d email_platform"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.5
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://email_platform:email_platform@localhost:5432/postgres?sslmode=disable
      DATABASE_URL: postgres://email_platform:email_platform@localhost:5432/email_platform?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal db)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0 # keep in sync with tools/go.mod
      - name: sqlc generated code is up to date
        run: go tool -modfile=tools/sqlc/go.mod sqlc diff
      - name: actionlint
        run: go tool -modfile=tools/actionlint/go.mod actionlint
      - name: live AWS tests excluded from every gate
        run: ./scripts/check-awslive.sh
      - name: Unit tests
        run: go test -race ./...
      - name: Migrations
        run: go run ./cmd/migrate up
      - name: Integration tests
        run: go test -race -tags=integration -count=1 ./...
      - name: Smoke test (API + worker processes)
        run: ./scripts/smoke.sh
      - name: Backup and restore drill
        run: ./scripts/restore-test.sh
        env:
          PG_EXEC: docker exec -i ${{ job.services.postgres.id }}
      - name: Build
        run: go build -trimpath -o bin/ ./cmd/...

  alerts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Alert rules, rule unit tests and routing (promtool, amtool)
        run: make test-alerts
      - name: Secrets rendering from SSM (stubbed aws CLI)
        run: ./deploy/bin/render-env_test.sh

  deploy-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Production Compose stack with local stand-ins (TLS database, HTTPS, monitoring)
        run: ./scripts/deploy-check.sh

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm --filter dashboard test
      - run: pnpm --filter dashboard lint
      - run: pnpm --filter dashboard typecheck
      - run: pnpm --filter dashboard build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: email_platform
          POSTGRES_PASSWORD: email_platform
          POSTGRES_DB: email_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U email_platform -d email_platform"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.5
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://email_platform:email_platform@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter dashboard exec playwright install --with-deps chromium
      - name: Dashboard browser E2E (API + worker on a throwaway database)
        run: ./scripts/e2e.sh

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose config -q
      - run: docker build -t email-platform:ci .
