# Known-vulnerability scans: the Go and dashboard dependencies (`make
# vulncheck`), the production container images and the end of life of
# their operating systems (`make imagecheck`), the end of life of pinned
# runtimes (`make eolcheck`) and, weekly, the development
# tools (`make vulncheck-dev`, report only).
# Separate from ci.yml because it also runs weekly: the advisory databases
# change without any commit. No secrets, no cloud access.
name: vulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulncheck-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  vulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: govulncheck (reachable Go code) and pnpm audit (production dependencies, high and critical)
        run: make vulncheck
      - name: End of life of pinned runtimes (fails at end of life, warns 90 days before)
        if: ${{ !cancelled() }}
        run: make eolcheck

  imagecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: grype (production container images, high and critical with a fix) and end of life of each image's operating system
        run: make imagecheck
        env:
          GRYPE_DB_DIR: ${{ runner.temp }}/grype-db

  # Report only: findings become warnings, scanner failures fail the job.
  vulncheck-dev:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Go tools and npm development dependencies (report only)
        run: make vulncheck-dev
