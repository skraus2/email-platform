# Local development infrastructure. Nothing here talks to AWS or relays mail:
# Mailpit captures every message locally (no MP_SMTP_RELAY_* is configured).
# All ports bind to 127.0.0.1 only.
#
#   make up                         # postgres + mailpit
#   docker compose --profile app up -d --build   # + migrate, api, worker in containers

name: email-platform

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: email_platform
      POSTGRES_PASSWORD: email_platform # local-only credential, not a secret
      POSTGRES_DB: email_platform
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54320}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email_platform -d email_platform"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.6
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI + API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # --- Application containers (opt-in: --profile app) ---------------------

  migrate:
    profiles: [app]
    build: .
    command: ["/app/migrate", "up"]
    environment: &app-env
      APP_ENV: development
      LOG_FORMAT: json
      DATABASE_URL: postgres://email_platform:email_platform@postgres:5432/email_platform?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build: .
    command: ["/app/api"]
    environment:
      <<: *app-env
      HTTP_ADDR: 0.0.0.0:8080
      # No WEBHOOK_KEKS here on purpose: webhook registration through the
      # API stays off (503) unless the operator adds it.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    profiles: [app]
    build: .
    command: ["/app/worker"]
    environment:
      <<: *app-env
      SMTP_ADDR: mailpit:1025
      # Required by the worker (webhook secrets); set it in .env.
      WEBHOOK_KEKS: ${WEBHOOK_KEKS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

volumes:
  postgres-data:
