packages:
  - apps/*
  - packages/*

# Supply-chain hygiene: do not install package versions younger than 24h.
minimumReleaseAge: 1440

# Install scripts are blocked by default (pnpm 10); these two only ship
# optional native speedups we do not need.
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# openapi-typescript (SDK type generator, dev-only) declares typescript@^5;
# it only emits text and works with the TypeScript version used here.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: "6"
