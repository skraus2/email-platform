# Image scan configuration (make imagecheck). Ignore rules suppress a
# finding only when it is not exploitable here or cannot be fixed by an
# image update yet. Every rule needs `vulnerability` and a `reason` saying
# why it is safe, ending in "revisit by YYYY-MM-DD". The date is mandatory
# and enforced: from that day on (UTC) the scan fails until the rule is
# re-assessed and removed or re-dated. A rule that no longer matches any
# finding fails the scan and must be removed.
check-for-app-update: false
ignore:
  - vulnerability: GHSA-2v4p-qf9q-27wj
    package: { location: "/bin/prometheus" }
    reason: "Prometheus v3.13.5 (latest LTS release) ships grpc v1.83.1; the advisory affects gRPC xDS servers only and Prometheus runs no xDS server. Remove with the next 3.13 patch release; revisit by 2026-11-24."
  - vulnerability: GHSA-2v4p-qf9q-27wj
    package: { location: "/bin/promtool" }
    reason: "Prometheus v3.13.5 (latest LTS release) ships grpc v1.83.1; the advisory affects gRPC xDS servers only and Prometheus runs no xDS server. Remove with the next 3.13 patch release; revisit by 2026-11-24."
  - vulnerability: GO-2026-6865
    package: { location: "/bin/alertmanager" }
    reason: "alertmanager v0.34.2 (latest release) ships klauspost/compress v1.19.1, fixed in 1.20.2. The flaw is a panic on crafted compressed frames. Alertmanager listens only on 127.0.0.1:9093 with clustering off, so only containers in the stack network namespace can reach it. Remove with the next release; revisit by 2026-12-07."
  - vulnerability: GO-2026-6865
    package: { location: "/bin/prometheus" }
    reason: "Prometheus v3.13.5 (latest LTS release) ships klauspost/compress v1.18.7, fixed in 1.20.2. The flaw is a panic on crafted compressed frames. Prometheus listens only on 127.0.0.1:9090, scrapes only this stack's own loopback targets and has no remote write or read. Remove with the next 3.13 patch release; revisit by 2026-12-07."
  - vulnerability: GO-2026-6865
    package: { location: "/bin/promtool" }
    reason: "Prometheus v3.13.5 (latest LTS release) ships klauspost/compress v1.18.7, fixed in 1.20.2. The flaw is a panic on crafted compressed frames. promtool is not run in production, only against this repository's own rule files. Remove with the next 3.13 patch release; revisit by 2026-12-07."
