# Image scan configuration (make imagecheck). Ignore rules suppress a
# finding only when it is not exploitable here or cannot be fixed by an
# image update yet. Every rule needs `vulnerability` and a `reason` saying
# why it is safe and when to revisit; a rule that no longer matches any
# finding fails the scan and must be removed.
check-for-app-update: false
ignore:
  - vulnerability: GO-2026-6603
    package: { location: "/bin/alertmanager" }
    reason: "alertmanager v0.34.1 is the latest release and was built before this fix. Server side: plain HTTP/1 on 127.0.0.1:9093, reachable only from the containers sharing the stack network namespace (no HTTP/2 or TLS server). Client side: requests go only to operator-configured receivers. Remove with the next release; revisit by 2026-11-24."
  - vulnerability: GO-2026-6603
    package: { location: "/bin/amtool" }
    reason: "alertmanager v0.34.1 is the latest release and was built before this fix. Server side: plain HTTP/1 on 127.0.0.1:9093, reachable only from the containers sharing the stack network namespace (no HTTP/2 or TLS server). Client side: requests go only to operator-configured receivers. Remove with the next release; revisit by 2026-11-24."
