openapi: 3.1.0
info:
  title: Email Platform API
  version: 0.2.0
  description: |
    Internal email sending API. Every request is authenticated with a
    project API key and only ever sees data of that project.

    Accepted is not delivered: `queued` means the request is persisted,
    `captured` means the local test sink (Mailpit) received the message,
    `submitted` means a real provider accepted it. Delivery is only reported
    from real provider events.
servers:
  - url: http://127.0.0.1:8080
    description: Local development
security:
  - projectKey: []
paths:
  /v1/emails:
    post:
      operationId: createEmail
      summary: Queue one email for one recipient
      description: |
        Returns `202` only after the email and its dispatch job are committed.

        Requires scope `emails:send`.

        Send an `Idempotency-Key` whenever a request may be retried. Within 24
        hours, a repeated request with the same key and the same payload
        returns the original response (same `id`, header
        `Idempotent-Replayed: true`) and creates nothing; the same key with a
        different payload returns `409 idempotency_key_reused`. Keys are scoped
        to the project. Without the header, every request creates a new email.

        Checks run in this order: validation, idempotency replay, suppression
        (`422 recipient_suppressed`), project rate limit (`429 rate_limited`).
        Rejected requests store nothing; neither they nor idempotent replays
        count towards the rate limit. Template fields are reserved and rejected with
        `422 templates_not_supported`.

        A `503` (or a lost connection) means the outcome is unknown: the
        email may have been accepted. Retry with the same `Idempotency-Key`
        to avoid a duplicate.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Client-chosen key, 1–255 printable ASCII characters without spaces
            (0x21–0x7E), sent at most once. Empty, repeated or invalid keys
            are rejected with `400 invalid_idempotency_key`. Expires 24 hours
            after first use: a retry later than that creates a new email.
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: "^[\\x21-\\x7E]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmailRequest"
            example:
              from: noreply@example.test
              to: customer@example.test
              subject: Welcome
              text: Your account is ready.
              html: <p>Your account is ready.</p>
      responses:
        "202":
          description: |
            Persisted and queued for dispatch, or the replay of an earlier
            request with the same idempotency key.
          headers:
            Idempotent-Replayed:
              description: "`true` when this is the stored response of an earlier request with the same key."
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateEmailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/emails/{id}:
    get:
      operationId: getEmail
      summary: Get the status of an email of the authenticated project
      description: |
        Requires scope `emails:read`. Unknown ids, malformed ids and ids of
        other projects all return the same `404`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Email"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    projectKey:
      type: http
      scheme: bearer
      description: "Project API key, format `ep_<prefix>_<secret>`. Shown once at creation."
  schemas:
    CreateEmailRequest:
      type: object
      additionalProperties: false
      required: [from, to, subject]
      properties:
        from:
          type: string
          format: email
          maxLength: 254
          description: Bare address, no display name.
        to:
          type: string
          format: email
          maxLength: 254
          description: Exactly one bare recipient address.
        subject:
          type: string
          minLength: 1
          maxLength: 255
          description: Must not contain CR, LF or NUL.
        text:
          type: string
          description: Plain-text body, at most 512 KiB. At least one of text/html is required.
        html:
          type: string
          description: HTML body, at most 512 KiB. At least one of text/html is required.
        template_id:
          description: Reserved. Rejected with 422 templates_not_supported.
        template_version:
          description: Reserved. Rejected with 422 templates_not_supported.
        variables:
          description: Reserved. Rejected with 422 templates_not_supported.
    CreateEmailResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          const: queued
    EmailStatus:
      type: string
      enum: [queued, sending, captured, submitted, failed]
    ErrorCode:
      type: string
      description: |
        Why the last dispatch attempt failed. Retryable codes (the email is
        retried until its attempts are used up): `provider_unreachable`,
        `provider_timeout`, `provider_protocol_error`, `provider_deferred`,
        `internal_error`. Permanent codes (no further attempts):
        `provider_rejected`, `message_invalid`, `unsafe_target`, `suppressed`,
        `project_disabled`, `content_missing`, `expired`.

        `provider_timeout` and `provider_protocol_error` mean the outcome of
        that attempt is unknown: a `failed` email with one of these codes may
        still have been delivered.
      enum:
        - provider_unreachable
        - provider_timeout
        - provider_protocol_error
        - provider_deferred
        - provider_rejected
        - message_invalid
        - unsafe_target
        - suppressed
        - project_disabled
        - content_missing
        - expired
        - internal_error
    Email:
      type: object
      required:
        [
          id,
          status,
          from,
          to,
          subject,
          attempts,
          error_code,
          created_at,
          updated_at,
          finished_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/EmailStatus"
        from:
          type: string
        to:
          type: string
        subject:
          type: string
        attempts:
          type: integer
          minimum: 0
          description: Dispatch attempts started so far.
        error_code:
          description: |
            `null` when no attempt has failed or the email was dispatched.
            While the status is `queued` or `sending`, the reason of the last
            failed attempt (a retry is pending); with status `failed`, the
            final reason.
          oneOf:
            - $ref: "#/components/schemas/ErrorCode"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable snake_case error code.
            message:
              type: string
              description: Human-readable explanation; never contains internals.
  responses:
    BadRequest:
      description: "Malformed request: `invalid_json` or `invalid_idempotency_key`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "`unauthorized`: missing, malformed, unknown or revoked key, or disabled project."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "`forbidden`: the key lacks the required scope."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "`idempotency_key_reused`: the key was already used with a different payload."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: "`rate_limited`: the project's send rate limit is exhausted; retry after `Retry-After` seconds."
      headers:
        Retry-After:
          description: Seconds until the current rate-limit window ends (1–60).
          schema:
            type: integer
            minimum: 1
            maximum: 60
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "`not_found`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: "`payload_too_large`: request body larger than 1 MiB."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: "`unsupported_media_type`: Content-Type is not application/json."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: "`validation_failed` (message names the field), `recipient_suppressed` (the recipient is on the project's suppression list) or `templates_not_supported`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: "`service_unavailable`: a dependency (e.g. the database) is temporarily unavailable; retry later."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: "`internal_error`: unexpected server error; details are logged, never returned."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
