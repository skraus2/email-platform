openapi: 3.1.0
info:
  title: Email Platform API
  version: 0.5.0
  description: |
    Internal email sending API. Every request is authenticated with a
    project API key and only ever sees data of that project.

    Accepted is not delivered: `queued` means the request is persisted,
    `captured` means the local test sink (Mailpit) received the message,
    `submitted` means a real provider accepted it. Delivery is only reported
    from real provider events: `delivered` (the receiving mail server
    accepted the message — not necessarily the inbox), `bounced` and
    `complained` exist only for emails sent through a real provider, never
    for the local test sink.

    Status changes are also pushed to registered webhook endpoints (see
    `webhooks`).

    Emails can be sent from stored templates: a template has immutable,
    numbered versions; a send names a version (or `"published"`, the highest
    one at that moment) and supplies variables, which are rendered with
    contextual HTML escaping and never stored.

    Emails can be scheduled (`scheduled_at`) and cancelled while queued.

    Contacts (with consent status and source) are grouped into audiences;
    a broadcast sends one template version to every subscribed,
    non-suppressed member of an audience, one email per recipient, with an
    unsubscribe link to the app's own page. The app reports unsubscribes
    with `POST /v1/unsubscribes`.

    Key scopes: `emails:send`, `emails:read`, `templates:read`,
    `templates:write`, `webhooks:write`, `contacts:read`,
    `contacts:write`, `broadcasts:read`, `broadcasts:write`. A key only has
    the scopes it was created with.
servers:
  - url: http://127.0.0.1:8080
    description: Local development
security:
  - projectKey: []
paths:
  /v1/emails:
    post:
      operationId: createEmail
      summary: Queue one email for one recipient
      description: |
        Returns `202` only after the email and its dispatch job are committed.

        Requires scope `emails:send`.

        Send an `Idempotency-Key` whenever a request may be retried. Within 24
        hours, a repeated request with the same key and the same payload
        returns the original response (same `id`, header
        `Idempotent-Replayed: true`) and creates nothing; the same key with a
        different payload returns `409 idempotency_key_reused`. Keys are scoped
        to the project. Without the header, every request creates a new email.

        Checks run in this order: validation, idempotency replay, sender
        verification (`422 sender_not_verified`, only where verified senders
        are required — always when sending through a real provider),
        schedule horizon and cap on planned sends (`422 validation_failed`,
        `422 schedule_limit_reached`), suppression (`422 recipient_suppressed`), project rate limit
        (`429 rate_limited`).
        Rejected requests store nothing; neither they nor idempotent replays
        count towards the rate limit.

        Two forms: raw (`subject` plus `text` and/or `html`) or template
        (`template_id`, `template_version`, `variables`). Mixing them gives
        `422 validation_failed`. In the template form the version is resolved
        (`"published"` = highest version at this moment) and rendered after
        the checks above (validation, idempotency replay, sender,
        suppression, rate limit); unknown templates, templates of other projects,
        unknown versions, and `"published"` on a template without versions
        all give the same `422 template_not_found`;
        variables that do not match the version's schema give
        `422 variables_invalid`; output that breaks the limits (subject
        1–255 characters without line breaks, bodies at most 512 KiB) gives
        `422 render_failed`. An idempotent replay is answered before any
        rendering, so a retry stays a replay even after a newer version was
        published. The rendered subject is kept with the email (bodies are
        deleted after sending), so do not put secrets or one-time codes into
        subject variables. `503` can also mean the server is busy rendering
        other templates; retry with the same `Idempotency-Key`.

        A `503` (or a lost connection) means the outcome is unknown: the
        email may have been accepted. Retry with the same `Idempotency-Key`
        to avoid a duplicate.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Client-chosen key, 1–255 printable ASCII characters without spaces
            (0x21–0x7E), sent at most once. Empty, repeated or invalid keys
            are rejected with `400 invalid_idempotency_key`. Expires 24 hours
            after first use: a retry later than that creates a new email.
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: "^[\\x21-\\x7E]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmailRequest"
            examples:
              raw:
                value:
                  from: noreply@example.test
                  to: customer@example.test
                  subject: Welcome
                  text: Your account is ready.
                  html: <p>Your account is ready.</p>
              template:
                value:
                  from: noreply@example.test
                  to: customer@example.test
                  template_id: 0192f0aa-0000-7000-8000-000000000001
                  template_version: published
                  variables:
                    name: Ada
                    plan: pro
      responses:
        "202":
          description: |
            Persisted and queued for dispatch, or the replay of an earlier
            request with the same idempotency key.
          headers:
            Idempotent-Replayed:
              description: "`true` when this is the stored response of an earlier request with the same key."
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateEmailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listEmails
      summary: List emails of the authenticated project, newest first
      description: |
        Requires scope `emails:read`. Filters combine with AND. Unknown or
        repeated single-value parameters and malformed values give `400`
        (`invalid_filter`, `invalid_limit`, `invalid_cursor`); the message
        names the parameter, never its value.
      parameters:
        - name: status
          in: query
          required: false
          description: Repeat for several statuses (at most 8).
          style: form
          explode: true
          schema:
            type: array
            maxItems: 8
            items:
              $ref: "#/components/schemas/EmailStatus"
        - name: recipient
          in: query
          required: false
          description: Exact recipient address, case-insensitive.
          schema:
            type: string
            maxLength: 254
        - name: template_id
          in: query
          required: false
          description: Only emails sent from this template (available together with template sends).
          schema:
            type: string
            format: uuid
        - name: broadcast_id
          in: query
          required: false
          description: Only recipient emails of this broadcast.
          schema:
            type: string
            format: uuid
        - name: created_after
          in: query
          required: false
          description: Inclusive lower bound (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          required: false
          description: Exclusive upper bound (RFC 3339); must be later than `created_after`.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Page size; values outside 1–100 give `400 invalid_limit`.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque `next_cursor` of the previous page; invalid values give `400 invalid_cursor`.
          schema:
            type: string
      responses:
        "200":
          description: One page of emails.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/emails/{id}:
    get:
      operationId: getEmail
      summary: Get the status of an email of the authenticated project
      description: |
        Requires scope `emails:read`. Unknown ids, malformed ids and ids of
        other projects all return the same `404`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Email"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/emails/{id}/events:
    get:
      operationId: listEmailEvents
      summary: List the events of an email of the authenticated project
      description: |
        Requires scope `emails:read`. Events are immutable and listed in the
        order they were received; provider events may arrive late, twice or
        out of order (duplicates are stored once). `occurred_at` is the
        event time reported by its origin, `received_at` when the platform
        stored it. Unknown ids, malformed ids and ids of other projects all
        return the same `404`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Page size; values outside 1–100 give `400 invalid_limit`.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque `next_cursor` of the previous page; invalid values give `400 invalid_cursor`.
          schema:
            type: string
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailEventList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/emails/{id}/cancel:
    post:
      operationId: cancelEmail
      summary: Cancel a queued (typically scheduled) email
      description: |
        Requires scope `emails:send`. Only an email in status `queued` can be
        cancelled; it becomes `canceled` (terminal, content deleted, an
        `email.canceled` event is recorded and sent to subscribed webhook
        endpoints). Any other status gives `409 email_not_cancelable` — for
        example when a worker claimed the email a moment earlier. Unknown,
        malformed and foreign ids give the same `404`. No request body.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The cancelled email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Email"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/contacts:
    post:
      operationId: createContact
      summary: Create a contact of the authenticated project
      description: |
        Requires scope `contacts:write`. The address is unique per project,
        case-insensitively (`409 contact_exists`). `status` is required:
        the app states whether the person consented to broadcasts; a
        `subscribed` contact needs a `consent_source` (where the consent
        came from, e.g. `signup-form`). A project holds at most 250000
        contacts by default (`422 contact_limit_reached`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listContacts
      summary: List contacts of the authenticated project, newest first
      description: |
        Requires scope `contacts:read`. Unknown or repeated parameters and
        malformed values give `400` (`invalid_filter`, `invalid_limit`,
        `invalid_cursor`).
      parameters:
        - name: email
          in: query
          required: false
          description: Exact address, case-insensitive.
          schema:
            type: string
            maxLength: 254
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ContactStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of contacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/contacts/{id}:
    get:
      operationId: getContact
      summary: Get a contact
      description: Requires scope `contacts:read`. Unknown, malformed and foreign ids give the same `404`.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: updateContact
      summary: Change a contact's consent status, consent source or attributes
      description: |
        Requires scope `contacts:write`. Fields not sent stay unchanged;
        `attributes` replaces all attributes. A request setting `status`
        to `subscribed` needs `consent_source` too; `null` values give
        `422 validation_failed`. `status_changed_at`
        moves only when the status changes.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContactRequest"
      responses:
        "200":
          description: The updated contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteContact
      summary: Delete a contact (erasure)
      description: |
        Requires scope `contacts:write`. Removes the contact and its audience
        memberships. Emails already created keep their recipient address
        (email retention applies); queued broadcast emails to the contact
        are not sent (`failed` with `contact_deleted`).
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/audiences:
    post:
      operationId: createAudience
      summary: Create an audience (a named list of contacts)
      description: |
        Requires scope `contacts:write`. Names are unique per project,
        case-insensitively (`409 audience_exists`). A project holds at most
        100 audiences by default (`422 audience_limit_reached`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAudienceRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Audience"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listAudiences
      summary: List audiences of the authenticated project, newest first
      description: Requires scope `contacts:read`. Without member counts (see `GET /v1/audiences/{id}`).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of audiences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudienceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/audiences/{id}:
    get:
      operationId: getAudience
      summary: Get an audience with its member count
      description: Requires scope `contacts:read`.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The audience.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudienceWithCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/audiences/{id}/contacts:
    post:
      operationId: addAudienceContacts
      summary: Add up to 1000 contacts to an audience
      description: |
        Requires scope `contacts:write`. Ids that are not contacts of the
        project count as `not_found`. An audience holds at most 100000
        contacts by default; an add that would exceed it adds nothing
        (`422 audience_full`).
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAudienceContactsRequest"
      responses:
        "200":
          description: Counts of the outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddAudienceContactsResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listAudienceContacts
      summary: List the contacts of an audience
      description: Requires scope `contacts:read`. Ordered by contact id.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of member contacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/audiences/{id}/contacts/{contact_id}:
    put:
      operationId: addAudienceContact
      summary: Add one contact to an audience (idempotent)
      description: Requires scope `contacts:write`. `422 audience_full` when the audience is at its limit.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/ContactID"
      responses:
        "204":
          description: The contact is a member.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: removeAudienceContact
      summary: Remove one contact from an audience (idempotent)
      description: Requires scope `contacts:write`.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/ContactID"
      responses:
        "204":
          description: The contact is not a member (any more).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/unsubscribes:
    post:
      operationId: reportUnsubscribe
      summary: Report an unsubscribe received on the app's unsubscribe page
      description: |
        Requires scope `contacts:write`. Broadcast emails link to the app's
        own unsubscribe page (the broadcast's `unsubscribe_url` with
        `{token}` replaced by the contact's token) and carry
        `List-Unsubscribe` + `List-Unsubscribe-Post: List-Unsubscribe=One-Click`
        (RFC 8058) with the same URL; the page must also accept that
        one-click `POST` (body `List-Unsubscribe=One-Click`). The app
        forwards the token here. The contact becomes `unsubscribed`: no
        broadcast reaches it any more, including emails already queued.
        Transactional sends to the address are not affected. Reports are
        idempotent and never rate-limited. Unknown, malformed, missing and
        foreign tokens give the same `404`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnsubscribeRequest"
      responses:
        "200":
          description: The contact is unsubscribed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnsubscribeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/broadcasts:
    post:
      operationId: createBroadcast
      summary: Create a broadcast draft
      description: |
        Requires scope `broadcasts:write`. A broadcast sends one template
        version to every `subscribed` member of an audience whose address is
        not suppressed — one email per recipient. Creating it only stores a
        draft (a retried create leaves another draft, nothing is sent);
        `POST /v1/broadcasts/{id}/schedule` starts it.

        The version is resolved now (`"published"` = highest version). Its
        schema must declare `unsubscribe_url` (string) and its text part —
        and html part, if any — must print `{{.unsubscribe_url}}` outside
        any condition (`422 template_missing_unsubscribe`). Per recipient,
        the variables are the shared `variables`, overlaid by the contact's
        attributes whose names the schema declares, plus `unsubscribe_url`.
        `unsubscribe_url` is an absolute `https` URL of the app's page with
        `{token}` exactly once (at most 900 characters).

        A project has at most 20 broadcasts in `draft`, `scheduled` or
        `sending` by default (`422 broadcast_limit_reached`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBroadcastRequest"
      responses:
        "201":
          description: The draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Broadcast"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listBroadcasts
      summary: List broadcasts of the authenticated project, newest first
      description: Requires scope `broadcasts:read`. Without counts (see `GET /v1/broadcasts/{id}`).
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BroadcastStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of broadcasts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/broadcasts/{id}:
    get:
      operationId: getBroadcast
      summary: Get a broadcast with its progress
      description: Requires scope `broadcasts:read`.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The broadcast with counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastWithCounts"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/broadcasts/{id}/schedule:
    post:
      operationId: scheduleBroadcast
      summary: Start a draft now or at a planned time
      description: |
        Requires scope `broadcasts:write`. Moves `draft` → `scheduled`; at
        `scheduled_at` (default: now; at most 30 days ahead) the platform
        creates the recipient emails in batches (`sending`) and finally
        `completed` — every recipient email exists, which says nothing about
        delivery. Any other status gives `409 broadcast_not_draft`: after a
        lost response, a retry answers `409` and `GET` shows the state. The
        sender is checked again (`422 sender_not_verified`).
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleBroadcastRequest"
      responses:
        "200":
          description: The scheduled broadcast.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Broadcast"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/broadcasts/{id}/cancel:
    post:
      operationId: cancelBroadcast
      summary: Cancel a broadcast
      description: |
        Requires scope `broadcasts:write`. Moves `draft`, `scheduled`,
        `sending` or `completed` → `canceled`: no further recipient emails
        are created, and queued ones become `canceled` instead of being sent
        (as their jobs run; an email already handed to the provider is not
        recalled). An already cancelled broadcast gives
        `409 broadcast_not_cancelable`. No request body.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The cancelled broadcast.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Broadcast"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/templates:
    post:
      operationId: createTemplate
      summary: Create a template of the authenticated project
      description: |
        Requires scope `templates:write`. Template creates and publishes of
        a project are limited to 60 per minute by default, counting every
        attempt (`429 rate_limited` with `Retry-After`); when the server is
        busy with other template writes it answers `503`. The slug is unique per project
        (`409 slug_taken`). A project holds at most 200 templates by default
        (`422 template_limit_reached`). A new template has no version yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/templates/{id}:
    get:
      operationId: getTemplate
      summary: Get a template of the authenticated project
      description: |
        Requires scope `templates:read`. Unknown ids, malformed ids and ids
        of other projects all return the same `404`.
      parameters:
        - $ref: "#/components/parameters/TemplateID"
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/templates/{id}/versions:
    post:
      operationId: publishTemplateVersion
      summary: Publish a new immutable version of a template
      description: |
        Requires scope `templates:write`. The version gets the next number
        (1, 2, …) and can never be changed or deleted. The sources are
        checked before storing (`422 template_invalid`, the message names
        the part and line): only `{{.name}}` for declared variables and
        `{{if}}`/`{{else if}}`/`{{else}}`/`{{end}}` on a declared string or
        boolean variable, or `eq`/`ne` of such a variable with a constant
        of the same type, are allowed; comments are allowed; anything else
        (loops, `with`, nested templates, functions, `$` variables) is
        refused. `html` is rendered with contextual escaping (variables
        cannot inject markup or `javascript:` URLs); `subject` and `text`
        are plain text. `text` is required so every HTML mail has a text
        alternative. A template holds at most 500 versions by default
        (`422 version_limit_reached`), and a project stores at most 50 MiB of
        template source over all versions by default
        (`422 template_storage_limit_reached`). Actions right after `<` (dynamic
        tag names) and inside `srcdoc`, `content` or `http-equiv` attributes
        are refused as well. Unknown templates and templates of
        other projects return `404`.
      parameters:
        - $ref: "#/components/parameters/TemplateID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishTemplateVersionRequest"
            example:
              subject: "Welcome, {{.name}}"
              text: 'Hello {{.name}}, {{if eq .plan "pro"}}thanks for going pro.{{else}}your account is ready.{{end}}'
              html: '<p>Hello {{.name}},</p>{{if eq .plan "pro"}}<p>Thanks for going pro.</p>{{end}}'
              variables:
                name: { type: string, required: true, max_length: 100 }
                plan: { type: string, required: false }
      responses:
        "201":
          description: Published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateVersionCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/templates/{id}/versions/{version}:
    get:
      operationId: getTemplateVersion
      summary: Get a published template version exactly as stored
      description: |
        Requires scope `templates:read`. Returns the sources exactly as
        published, also when newer versions exist. Unknown templates,
        templates of other projects and unknown versions return `404`.
      parameters:
        - $ref: "#/components/parameters/TemplateID"
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/webhook-endpoints:
    post:
      operationId: createWebhookEndpoint
      summary: Register a webhook endpoint of the authenticated project
      description: |
        Requires scope `webhooks:write`. The response is the only time the
        signing `secret` is shown; store it. Without `event_types` the
        endpoint receives all types. The URL must be `https` (or `http`
        where the operator allows it) and must not point to a forbidden
        address (`422 invalid_url`; the message never contains resolved
        addresses). A project holds at most 10 endpoints by default
        (`422 endpoint_limit_reached`). A retried request creates another
        endpoint; ask an operator to disable one you lost the secret of.

        Registration through the API is optional per deployment: where it
        is not enabled the route answers
        `503 webhook_registration_disabled`, and endpoints are registered by
        an administrator instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookEndpointRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
webhooks:
  emailStatusChanged:
    post:
      operationId: emailStatusChanged
      summary: An email changed its status
      description: |
        Sent to every active webhook endpoint of the project subscribed to
        the event type, once per status change (duplicate or late provider
        events that do not change the status are not sent). Endpoints are
        registered by an administrator or through
        `POST /v1/webhook-endpoints`; the endpoint secret is shown once.

        Verify every request: compute HMAC-SHA256 keyed with the endpoint
        secret exactly as shown (the full `whsec_…` string as UTF-8 bytes)
        over `<Webhook-Timestamp>.<raw request body>` and compare it in
        constant time with each hex value after `v1=` in
        `Webhook-Signature`. Accept the request if any `v1=` value matches,
        ignore values of other versions, reject it if none matches. The
        header currently always carries one value (rotating a secret
        replaces it immediately); accept several for forward compatibility.
        Reject timestamps more than 5 minutes away from your clock, and use
        `Webhook-Id` (equal to the body `id`) to drop replays and
        duplicates: keep seen ids at least for the timestamp tolerance,
        better for the maximum retry duration (about 5 hours). A retry repeats the identical body with a new timestamp
        and signature. Events carry no ordering guarantee; fetch
        `GET /v1/emails/{id}` for the current status.

        Respond with any `2xx` to acknowledge receipt (not processing).
        Timeouts (10 s by default), connection errors, `408`, `429` and
        `5xx` are retried with exponential backoff and jitter (12 attempts
        within about 5 hours by default); any other status, including redirects,
        ends the delivery as failed.
      parameters:
        - name: Webhook-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: Webhook-Timestamp
          in: header
          required: true
          description: Unix time in seconds when this attempt was signed.
          schema:
            type: string
            pattern: "^[0-9]+$"
        - name: Webhook-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: "^v1=[0-9a-f]{64}( v1=[0-9a-f]{64})*$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
      responses:
        "200":
          description: Any 2xx acknowledges receipt.
components:
  securitySchemes:
    projectKey:
      type: http
      scheme: bearer
      description: "Project API key, format `ep_<prefix>_<secret>`. Shown once at creation. Scopes: `emails:send`, `emails:read`, `templates:read`, `templates:write`, `webhooks:write`, `contacts:read`, `contacts:write`, `broadcasts:read`, `broadcasts:write`."
  schemas:
    CreateEmailRequest:
      type: object
      additionalProperties: false
      description: |
        Raw form: `subject` plus `text` and/or `html`. Template form:
        `template_id` and `template_version`, plus `variables` (may be
        omitted when the version has no required variables). Mixing the
        forms gives `422 validation_failed`.
      required: [from, to]
      properties:
        from:
          type: string
          format: email
          maxLength: 254
          description: |
            Bare address, no display name, ASCII only (international domains
            in punycode, e.g. `xn--bcher-kva.test`).
        to:
          type: string
          format: email
          maxLength: 254
          description: |
            Exactly one bare recipient address, ASCII only (international
            domains in punycode). Other addresses get `422 validation_failed`.
        subject:
          type: string
          minLength: 1
          maxLength: 255
          description: Raw form only. Must not contain CR, LF or NUL.
        text:
          type: string
          description: Plain-text body, at most 512 KiB. At least one of text/html is required.
        html:
          type: string
          description: HTML body, at most 512 KiB. At least one of text/html is required.
        template_id:
          type: string
          format: uuid
          description: Template form. A template of the authenticated project.
        template_version:
          description: Template form. A version number, or `"published"` for the highest version at this moment.
          oneOf:
            - type: integer
              minimum: 1
            - type: string
              const: published
        variables:
          type: object
          description: |
            Template form. Values for the version's declared variables:
            strings, numbers or booleans as declared (`null` is not
            accepted). Unknown names, missing required variables, wrong
            types and strings over their `max_length` give
            `422 variables_invalid`. Variables are not stored.
          additionalProperties:
            type: [string, number, boolean]
        scheduled_at:
          type: string
          format: date-time
          description: |
            Send not before this time (RFC 3339), at most 30 days ahead by
            default (`422 validation_failed` otherwise). A time at or before
            now sends immediately (stored as `null`). A project may have at
            most 10000 planned sends waiting by default
            (`422 schedule_limit_reached`). Part of the idempotency
            fingerprint when present.
    CreateEmailResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          const: queued
    EmailStatus:
      type: string
      description: |
        `queued` → `sending` → `captured` (local test sink), `submitted`
        (real provider) or `failed`; a `queued` email can be cancelled
        (`canceled`, terminal, never handed to a provider). A scheduled
        email stays `queued` until it is due. After `submitted`, provider events move
        the status to `delivered`, `bounced` or `complained`; a later event
        never moves it back (`complained` > `bounced` > `delivered` >
        `submitted`).
      enum:
        [
          queued,
          sending,
          captured,
          submitted,
          delivered,
          bounced,
          complained,
          failed,
          canceled,
        ]
    ErrorCode:
      type: string
      description: |
        Why the last dispatch attempt failed. Retryable codes (the email is
        retried until its attempts are used up): `provider_unreachable`,
        `provider_timeout`, `provider_protocol_error`, `provider_deferred`,
        `provider_throttled`, `internal_error`. Permanent codes (no further
        attempts): `provider_rejected`, `provider_auth_failed`,
        `sender_not_verified`, `message_invalid`, `unsafe_target`,
        `suppressed`, `project_disabled`, `content_missing`, `expired`,
        and for broadcast emails `unsubscribed` (the contact unsubscribed
        before the send), `contact_deleted`, `broadcast_canceled` (the
        broadcast was cancelled after an attempt with unknown outcome),
        `render_failed` (the contact's attributes no longer render).

        `provider_timeout` and `provider_protocol_error` mean the outcome of
        that attempt is unknown: a `failed` email with one of these codes may
        still have been delivered. With a real provider, the same holds for
        `provider_unreachable` when the provider answered with a server error
        (5xx) rather than refusing the connection. The same holds for `suppressed` and
        `project_disabled` on an email with `attempts` > 0 whose earlier
        attempt ended with an unknown outcome: no further attempt is made.
      enum:
        - provider_unreachable
        - provider_timeout
        - provider_protocol_error
        - provider_deferred
        - provider_throttled
        - provider_rejected
        - provider_auth_failed
        - sender_not_verified
        - message_invalid
        - unsafe_target
        - suppressed
        - project_disabled
        - content_missing
        - expired
        - unsubscribed
        - contact_deleted
        - broadcast_canceled
        - render_failed
        - internal_error
    Email:
      type: object
      required:
        [
          id,
          status,
          from,
          to,
          subject,
          attempts,
          error_code,
          created_at,
          updated_at,
          finished_at,
          template_id,
          template_version,
          scheduled_at,
          broadcast_id,
        ]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/EmailStatus"
        from:
          type: string
        to:
          type: string
        subject:
          type: string
        attempts:
          type: integer
          minimum: 0
          description: Dispatch attempts started so far.
        error_code:
          description: |
            `null` when no attempt has failed or the email was dispatched.
            While the status is `queued` or `sending`, the reason of the last
            failed attempt (a retry may be pending; otherwise the email is
            closed by expiry); with status `failed`, the
            final reason.
          oneOf:
            - $ref: "#/components/schemas/ErrorCode"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        template_id:
          type: [string, "null"]
          format: uuid
          description: Template of a template send; `null` for raw sends.
        template_version:
          type: [integer, "null"]
          minimum: 1
          description: The resolved version number (also when `"published"` was requested).
        scheduled_at:
          type: [string, "null"]
          format: date-time
          description: Planned send time; `null` for immediate sends.
        broadcast_id:
          type: [string, "null"]
          format: uuid
          description: The broadcast this email belongs to; `null` otherwise.
    EmailList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Email"
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` for the next page; `null` on the last page.
    VariableSpec:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [string, number, boolean]
        required:
          type: boolean
          default: false
        max_length:
          type: integer
          minimum: 1
          maximum: 10000
          description: Strings only; default 1000 characters.
    VariableSchema:
      type: object
      maxProperties: 50
      description: Declared variables by name (`^[a-z][a-z0-9_]{0,39}$`).
      propertyNames:
        pattern: "^[a-z][a-z0-9_]{0,39}$"
      additionalProperties:
        $ref: "#/components/schemas/VariableSpec"
    CreateTemplateRequest:
      type: object
      additionalProperties: false
      required: [slug]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
        name:
          type: string
          maxLength: 200
    Template:
      type: object
      required: [id, slug, name, latest_version, created_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        latest_version:
          type: [integer, "null"]
          minimum: 1
          description: Highest published version; `null` while none exists.
        created_at:
          type: string
          format: date-time
    PublishTemplateVersionRequest:
      type: object
      additionalProperties: false
      required: [subject, text]
      properties:
        subject:
          type: string
          minLength: 1
          description: Plain-text template, at most 1000 bytes.
        text:
          type: string
          minLength: 1
          description: Plain-text template, at most 512 KiB.
        html:
          type: string
          description: HTML template, at most 512 KiB, rendered with contextual escaping.
        variables:
          $ref: "#/components/schemas/VariableSchema"
    TemplateVersionCreated:
      type: object
      required: [template_id, version, created_at]
      properties:
        template_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
    TemplateVersion:
      type: object
      required:
        [template_id, version, subject, text, html, variables, created_at]
      properties:
        template_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        subject:
          type: string
        text:
          type: string
        html:
          type: [string, "null"]
        variables:
          $ref: "#/components/schemas/VariableSchema"
        created_at:
          type: string
          format: date-time
    WebhookEventType:
      type: string
      enum:
        [
          email.captured,
          email.submitted,
          email.failed,
          email.delivered,
          email.bounced,
          email.complained,
          email.canceled,
        ]
    CreateWebhookEndpointRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        event_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WebhookEventType"
    WebhookEndpointCreated:
      type: object
      required: [id, url, event_types, status, created_at, secret]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        event_types:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
        status:
          type: string
          enum: [active]
        created_at:
          type: string
          format: date-time
        secret:
          type: string
          description: Signing secret (`whsec_…`). Shown only in this response.
    EmailEvent:
      type: object
      required: [id, type, origin, provider, occurred_at, received_at, details]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: |
            Platform events: `captured`, `submitted`, `failed`, `canceled`. Provider
            events: `send`, `delivered`, `bounced`, `complained`, `rejected`,
            `delivery_delayed`. Engagement (open/click) is not tracked.
          enum:
            [
              captured,
              submitted,
              failed,
              canceled,
              send,
              delivered,
              bounced,
              complained,
              rejected,
              delivery_delayed,
            ]
        origin:
          type: string
          enum: [platform, ses]
        provider:
          type: [string, "null"]
          description: Provider involved (`mailpit`, `ses`); `null` for `failed` events.
        occurred_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        details:
          type: object
          description: |
            Non-personal details only: `error_code` (failed),
            `bounce_type`/`bounce_subtype` (bounced),
            `complaint_feedback_type` (complained), `delay_type`
            (delivery_delayed). Never addresses or diagnostic text.
          additionalProperties:
            type: string
    EmailEventList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EmailEvent"
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` for the next page; `null` on the last page.
    WebhookEvent:
      type: object
      required: [id, type, created_at, data]
      properties:
        id:
          type: string
          format: uuid
          description: Event id, stable across retries; equals `Webhook-Id`.
        type:
          type: string
          enum:
            [
              email.captured,
              email.submitted,
              email.failed,
              email.delivered,
              email.bounced,
              email.complained,
              email.canceled,
            ]
        created_at:
          type: string
          format: date-time
          description: When the platform received and stored the event.
        data:
          type: object
          required: [email_id, project_id]
          properties:
            email_id:
              type: string
              format: uuid
            project_id:
              type: string
              format: uuid
    ContactStatus:
      type: string
      description: "`subscribed`: the person consented to broadcasts. `unsubscribed`: no broadcast is sent to the contact."
      enum: [subscribed, unsubscribed]
    ContactAttributes:
      type: object
      description: |
        Values for personalising broadcasts: at most 20 entries, names
        `^[a-z][a-z0-9_]{0,39}$` (not `unsubscribe_url`), values strings (at
        most 1000 characters), finite numbers or booleans; at most 8 KiB as
        compact JSON. Attributes are matched by name to a template's
        declared variables; undeclared ones are ignored. Never logged.
      maxProperties: 20
      propertyNames:
        pattern: "^[a-z][a-z0-9_]{0,39}$"
      additionalProperties:
        type: [string, number, boolean]
    CreateContactRequest:
      type: object
      additionalProperties: false
      required: [email, status]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Bare address, ASCII only (as for `to`).
        status:
          $ref: "#/components/schemas/ContactStatus"
        consent_source:
          type: string
          minLength: 1
          maxLength: 100
          description: Where the consent came from (printable characters). Required when `status` is `subscribed`.
        attributes:
          $ref: "#/components/schemas/ContactAttributes"
    UpdateContactRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status:
          $ref: "#/components/schemas/ContactStatus"
        consent_source:
          type: string
          minLength: 1
          maxLength: 100
          description: Required whenever `status` is `subscribed` in the same request.
        attributes:
          $ref: "#/components/schemas/ContactAttributes"
    Contact:
      type: object
      required:
        [
          id,
          email,
          status,
          consent_source,
          status_changed_at,
          attributes,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        status:
          $ref: "#/components/schemas/ContactStatus"
        consent_source:
          type: [string, "null"]
        status_changed_at:
          type: string
          format: date-time
        attributes:
          $ref: "#/components/schemas/ContactAttributes"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContactList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` for the next page; `null` on the last page.
    CreateAudienceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    Audience:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
    AudienceWithCount:
      allOf:
        - $ref: "#/components/schemas/Audience"
        - type: object
          required: [contact_count]
          properties:
            contact_count:
              type: integer
              minimum: 0
    AudienceList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Audience"
        next_cursor:
          type: [string, "null"]
    AddAudienceContactsRequest:
      type: object
      additionalProperties: false
      required: [contact_ids]
      properties:
        contact_ids:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            format: uuid
    AddAudienceContactsResult:
      type: object
      required: [added, already_members, not_found]
      properties:
        added:
          type: integer
          minimum: 0
        already_members:
          type: integer
          minimum: 0
        not_found:
          type: integer
          minimum: 0
    UnsubscribeRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: The token from the unsubscribe URL (43 characters, base64url).
    UnsubscribeResult:
      type: object
      required: [contact_id, status]
      properties:
        contact_id:
          type: string
          format: uuid
        status:
          type: string
          const: unsubscribed
    BroadcastStatus:
      type: string
      description: |
        `draft` → `scheduled` → `sending` (recipient emails are being
        created) → `completed` (all recipient emails exist; delivery is
        tracked per email). `canceled` from any other status.
      enum: [draft, scheduled, sending, completed, canceled]
    CreateBroadcastRequest:
      type: object
      additionalProperties: false
      required:
        [audience_id, from, template_id, template_version, unsubscribe_url]
      properties:
        name:
          type: string
          maxLength: 200
        audience_id:
          type: string
          format: uuid
        from:
          type: string
          format: email
          maxLength: 254
        template_id:
          type: string
          format: uuid
        template_version:
          oneOf:
            - type: integer
              minimum: 1
            - type: string
              const: published
        variables:
          type: object
          description: Shared values for declared variables (at most 16 KiB); contact attributes override them. Not echoed.
          additionalProperties:
            type: [string, number, boolean]
        unsubscribe_url:
          type: string
          maxLength: 900
          description: "Absolute `https` URL of the app's unsubscribe page containing `{token}` exactly once, e.g. `https://app.example.test/unsubscribe?t={token}`."
    ScheduleBroadcastRequest:
      type: object
      additionalProperties: false
      properties:
        scheduled_at:
          type: string
          format: date-time
          description: Start time (RFC 3339), at most 30 days ahead by default; omitted or past = now.
    Broadcast:
      type: object
      required:
        [
          id,
          name,
          status,
          audience_id,
          from,
          template_id,
          template_version,
          unsubscribe_url,
          scheduled_at,
          started_at,
          finished_at,
          created_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: "#/components/schemas/BroadcastStatus"
        audience_id:
          type: string
          format: uuid
        from:
          type: string
        template_id:
          type: string
          format: uuid
        template_version:
          type: integer
          minimum: 1
        unsubscribe_url:
          type: string
        scheduled_at:
          type: [string, "null"]
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
          description: When the last recipient email was created, or when the broadcast was cancelled.
        created_at:
          type: string
          format: date-time
    BroadcastWithCounts:
      allOf:
        - $ref: "#/components/schemas/Broadcast"
        - type: object
          required: [counts]
          properties:
            counts:
              type: object
              required:
                [
                  recipients,
                  skipped_unsubscribed,
                  skipped_suppressed,
                  skipped_invalid,
                  by_status,
                ]
              properties:
                recipients:
                  type: integer
                  minimum: 0
                  description: Recipient emails created.
                skipped_unsubscribed:
                  type: integer
                  minimum: 0
                skipped_suppressed:
                  type: integer
                  minimum: 0
                skipped_invalid:
                  type: integer
                  minimum: 0
                  description: Members whose attributes did not render with the version.
                by_status:
                  type: object
                  description: Current status of the recipient emails (emails deleted by retention are no longer counted).
                  additionalProperties: false
                  required:
                    [
                      queued,
                      sending,
                      captured,
                      submitted,
                      delivered,
                      bounced,
                      complained,
                      failed,
                      canceled,
                    ]
                  properties:
                    queued: { type: integer, minimum: 0 }
                    sending: { type: integer, minimum: 0 }
                    captured: { type: integer, minimum: 0 }
                    submitted: { type: integer, minimum: 0 }
                    delivered: { type: integer, minimum: 0 }
                    bounced: { type: integer, minimum: 0 }
                    complained: { type: integer, minimum: 0 }
                    failed: { type: integer, minimum: 0 }
                    canceled: { type: integer, minimum: 0 }
    BroadcastList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Broadcast"
        next_cursor:
          type: [string, "null"]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable snake_case error code.
            message:
              type: string
              description: Human-readable explanation; never contains internals.
  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContactID:
      name: contact_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: Page size; values outside 1–100 give `400 invalid_limit`.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque `next_cursor` of the previous page; invalid values give `400 invalid_cursor`.
      schema:
        type: string
    TemplateID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: "Malformed request: `invalid_json` (also for unknown, case-variant or duplicate field names — names are exact and case-sensitive), `invalid_idempotency_key`, `invalid_cursor`, `invalid_limit` or `invalid_filter`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "`unauthorized`: missing, malformed, unknown or revoked key, or disabled project."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "`forbidden`: the key lacks the required scope."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "`idempotency_key_reused` (the key was already used with a different payload), `slug_taken` (the project already has a template with this slug), `contact_exists`, `audience_exists`, `email_not_cancelable`, `broadcast_not_draft` or `broadcast_not_cancelable`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: "`rate_limited`: the project's send rate limit (or, for template writes, its template write limit) is exhausted; retry after `Retry-After` seconds."
      headers:
        Retry-After:
          description: Seconds until the current rate-limit window ends (1–60).
          schema:
            type: integer
            minimum: 1
            maximum: 60
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "`not_found`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: "`payload_too_large`: request body larger than 1 MiB (3 MiB for publishing a template version)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: "`unsupported_media_type`: Content-Type is not application/json."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: "`validation_failed` (message names the field), `recipient_suppressed` (the recipient is on the project's suppression list), `sender_not_verified` (`from` is not a verified sender address or domain of the project), `template_not_found`, `variables_invalid`, `render_failed`, `template_invalid`, `template_limit_reached`, `version_limit_reached`, `template_storage_limit_reached`, `invalid_url`, `endpoint_limit_reached`, `contact_limit_reached`, `audience_limit_reached`, `audience_full`, `audience_not_found`, `broadcast_limit_reached`, `template_missing_unsubscribe` or `schedule_limit_reached`. Messages name fields or variables, never their values."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: "`service_unavailable`: a dependency (e.g. the database) is temporarily unavailable; retry later. `webhook_registration_disabled`: webhook registration through the API is not enabled in this deployment (no `Retry-After`)."
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: "`internal_error`: unexpected server error; details are logged, never returned."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
